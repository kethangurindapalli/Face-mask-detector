<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Mask Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #00d4aa; }
        .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.95rem; }
        .video-container {
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 212, 170, 0.15);
        }
        .video-container img {
            display: block;
            width: 100%;
            height: auto;
        }
        .status {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: #1a1a1a;
            font-size: 0.9rem;
            color: #aaa;
        }
        .footer {
            margin-top: 2rem;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <h1>Face Mask Detector</h1>
    <p class="subtitle">Real-time CNN-based mask detection with MobileNetV2</p>

    <div class="video-container">
        <img src="/video_feed" alt="Live webcam feed">
    </div>

    <div class="status">Live stream active &mdash; refresh page if stream freezes</div>
    <div class="footer">Green = Mask &bull; Red = No Mask</div>
</body>
</html>
